repos:
  - repo: local
    hooks:
      - id: dependency-check
        name: Check dependency structure
        entry: python scripts/validate_dependencies.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [commit]
      
      - id: forbidden-imports
        name: Detect forbidden imports
        entry: bash -c 'grep -r "from httpx\|import httpx" agent/core agent/execution agent/compression 2>/dev/null && exit 1 || exit 0'
        language: system
        pass_filenames: false
        stages: [commit]
      
      - id: jsonschema-validation
        name: Validate JSON schemas
        entry: python -m jsonschema --help > /dev/null && echo "jsonschema available"
        language: system
        pass_filenames: false
        stages: [commit]
