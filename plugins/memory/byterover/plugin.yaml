name: byterover
version: 1.0.0
description: "ByteRover — persistent knowledge tree with tiered retrieval via the brv CLI."
external_dependencies:
  # No auto-install: the byterover.dev install.sh fetch-and-exec was removed.
  # Install the brv CLI manually (see the byterover docs) — Hercules only
  # checks for its presence, it never downloads and runs a third-party installer.
  - name: brv
    check: "brv --version"
hooks:
  - on_pre_compress
