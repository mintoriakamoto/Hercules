[package]
name = "consciousness_metrics"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "High-performance consciousness metrics engine with Python bindings"
authors = ["Nous Research <info@nousresearch.com>"]
license = "MIT"

[lib]
name = "consciousness_metrics"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hashbrown = "0.15"
parking_lot = "0.12"
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
smallvec = "1.11"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "consciousness_metrics_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true
