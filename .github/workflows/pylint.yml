name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the package in editable mode so imports resolve.
        # Core + acp extra covers the majority of import-error noise.
        pip install -e ".[acp]" || pip install -e .
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        # Disable the checks that drown the signal on a large agent codebase:
        # - cyclic-import: intentional architecture
        # - missing-*-docstring: not enforced project-wide
        # - too-many-*: common in agent/tool code
        # - duplicate-code: high false-positive rate across tools
        # - import-error: optional extras and platform-specific modules
        pylint --fail-under=0 \
          --disable=cyclic-import,missing-module-docstring,missing-class-docstring,missing-function-docstring,too-many-lines,too-many-statements,too-many-branches,too-many-locals,too-many-return-statements,too-many-arguments,too-many-instance-attributes,duplicate-code,import-error,unused-import \
          --ignore=website,tests,optional-skills,scripts \
          $(git ls-files '*.py' | grep -v -E '^(website/|tests/|optional-skills/|scripts/)' || true)
