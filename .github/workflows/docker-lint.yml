name: Docker / shell lint

# Lints the container build inputs: Dockerfile (via hadolint) and every shell
# script in the tree (via shellcheck). These catch the class of regression
# the behavioral docker smoke test can't — unquoted variable
# expansions, silently-failing RUN commands, etc.
#
# Coverage used to stop at docker/, which left install_hercules.sh — the one
# script a user runs as root on a fresh machine — linted by nothing. An
# unterminated here-document shipped to main that way: the script could not be
# parsed, let alone run. shellcheck flags exactly that (SC1044/SC1072/SC1073)
# at the severity already configured below, so the gap was coverage, not rules.
#
# Rules and ignores are documented in .hadolint.yaml at the repo root.
# shellcheck severity is pinned to `error` so SC1091-style "can't follow
# sourced script" info-level warnings don't fail the job — the .venv
# activate script doesn't exist at lint time.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  shellcheck:
    name: Lint shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          # Severity = error: SC1091 (can't follow sourced script) is info-
          # level and would otherwise fail when the venv activate script
          # doesn't exist at lint time.
          SHELLCHECK_OPTS: --severity=error
        with:
          # Whole tree, not just docker/. Scanning '.' also covers the root
          # install_hercules.sh and anything added later without a workflow
          # edit, which is the point — a new script should not be able to
          # arrive unlinted.
          scandir: '.'

      # Belt and braces: the action resolves its own file list, so assert
      # directly that bash itself can parse every tracked script. A script that
      # does not parse cannot run a single line, which is a different and worse
      # failure than a lint finding.
      - name: bash -n every tracked shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

  installer-dry-run:
    name: install_hercules.sh --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the installer's real argument parsing, package-set assembly and
      # pip-spec construction, then exits before the first mutating command.
      # Deliberately NOT as root and with no TTY: that is what proves the
      # non-interactive path works, and it is the only automated exercise this
      # script has ever had. It would have caught the malformed pip requirement
      # ('src[hercules-agent[ml]]') that no combination of answers could install.
      - name: Dry run resolves a plan and changes nothing
        run: |
          set -euo pipefail
          out="$(./install_hercules.sh --dry-run < /dev/null)"
          printf '%s\n' "$out"
          echo "$out" | grep -q 'Dry run complete'
          # The pip spec must be a bare path or path[extra,...] -- never a
          # package name inside the extras brackets.
          echo "$out" | grep -E 'pip spec +: /opt/hercules/src(\[[a-z0-9,-]+\])?$'

      - name: --dev adds the dev extra, still without mutating
        run: |
          set -euo pipefail
          ./install_hercules.sh --dev --dry-run < /dev/null \
            | grep -E 'pip spec +: /opt/hercules/src\[dev\]'

      - name: An unknown flag is rejected, not silently ignored
        run: |
          set -euo pipefail
          if ./install_hercules.sh --no-gpus --dry-run < /dev/null; then
            echo "expected a non-zero exit for an unknown flag" >&2
            exit 1
          fi
