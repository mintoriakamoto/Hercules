name: Setup uv + Python environment
description: Install uv, Python 3.11, and dependencies with caching

inputs:
  install-extras:
    description: Extra features to install (space-separated, e.g. "all dev")
    default: "all dev"
  python-version:
    description: Python version to install
    default: "3.11"
  locked:
    description: Whether to use --locked flag for uv sync
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Build uv sync command
      id: cmd
      shell: bash
      env:
        _EXTRAS: ${{ inputs.install-extras }}
        _LOCKED: ${{ inputs.locked }}
        _PY: ${{ inputs.python-version }}
      run: |
        cmd="uv sync --python $_PY"
        [ "$_LOCKED" = "true" ] && cmd="$cmd --locked"
        for e in $_EXTRAS; do cmd="$cmd --extra $e"; done
        echo "command=$cmd" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      uses: ./.github/actions/retry
      with:
        command: ${{ steps.cmd.outputs.command }}

    - name: Minimize uv cache
      shell: bash
      run: uv cache prune --ci
