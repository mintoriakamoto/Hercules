# Automatically label PRs based on files changed (actions/labeler v5+ format)

'type: bugfix':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/approval.py'
          - 'tools/delegate_tool.py'
          - 'tools/registry.py'

'type: security':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/approval.py'
          - 'tools/delegate_tool.py'
          - 'tools/registry.py'

'area: approval':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/approval.py'
          - 'tools/terminal_tool.py'

'area: delegation':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/delegate_tool.py'

'area: registry':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/registry.py'

'area: skills':
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/skills*.py'

'area: gateway':
  - changed-files:
      - any-glob-to-any-file:
          - 'gateway/**/*'
          - 'tui_gateway/**/*'

'area: agent':
  - changed-files:
      - any-glob-to-any-file:
          - 'agent/**/*'
          - 'run_agent.py'
          - 'tools/memory_tool.py'
          - 'tools/url_safety.py'

'area: cli':
  - changed-files:
      - any-glob-to-any-file:
          - 'hercules_cli/**/*'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'CLAUDE.md'
          - 'README.md'
          - '**/*.md'

'area: tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'

'area: cron':
  - changed-files:
      - any-glob-to-any-file:
          - 'cron/**/*'

'area: config':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.yaml'
          - '**/*.yml'
          - 'config/**/*'
